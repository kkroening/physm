<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 336" width="720" height="336" role="img" aria-label="A six-node kinematic tree beside the six-by-six sparsity pattern of the mass matrix. Frame 2's ancestor and subtree are highlighted on the tree; the same three frames are the only nonzero entries in row 2 and column 2 of the matrix.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="@BLUE@"/>
    </marker>
  </defs>

  <text x="20" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="@FG@" opacity="0.62">KINEMATIC TREE</text>
  <text x="404" y="20" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="@FG@" opacity="0.62">SPARSITY OF g</text>
  <line x1="366" y1="8" x2="366" y2="316" stroke="@FG@" stroke-width="1" opacity="0.2"/>

  <rect x="56" y="98" width="68" height="136" rx="8" fill="@BLUE@" opacity="0.13"/>
  <text x="20" y="252" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="@BLUE@">D(2)</text>

  <g stroke="@FG@" stroke-width="1.6" opacity="0.55">
    <line x1="170" y1="76" x2="105" y2="112"/>
    <line x1="170" y1="76" x2="245" y2="112"/>
    <line x1="90"  y1="140" x2="90"  y2="188"/>
    <line x1="260" y1="140" x2="260" y2="188"/>
    <line x1="260" y1="216" x2="260" y2="264"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" text-anchor="middle">
    <circle cx="170" cy="58" r="18" fill="none" stroke="@BLUE@" stroke-width="2.4"/>
    <text x="170" y="63" fill="@FG@">1</text>
    <circle cx="90" cy="122" r="18" fill="@BLUE@"/>
    <text x="90" y="127" fill="@BG@">2</text>
    <circle cx="90" cy="206" r="18" fill="none" stroke="@BLUE@" stroke-width="2.4" stroke-dasharray="3 3"/>
    <text x="90" y="211" fill="@FG@">3</text>
    <circle cx="260" cy="122" r="18" fill="none" stroke="@FG@" stroke-width="1.4" opacity="0.55"/>
    <text x="260" y="127" fill="@FG@" opacity="0.55">4</text>
    <circle cx="260" cy="206" r="18" fill="none" stroke="@FG@" stroke-width="1.4" opacity="0.55"/>
    <text x="260" y="211" fill="@FG@" opacity="0.55">5</text>
    <circle cx="260" cy="290" r="18" fill="none" stroke="@FG@" stroke-width="1.4" opacity="0.55"/>
    <text x="260" y="295" fill="@FG@" opacity="0.55">6</text>
  </g>

  <text x="196" y="44" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@BLUE@">ancestor</text>
  <text x="118" y="126" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@BLUE@">frame 2</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@FG@" opacity="0.6" text-anchor="middle">
    <text x="449" y="50">1</text><text x="479" y="50">2</text><text x="509" y="50">3</text>
    <text x="539" y="50">4</text><text x="569" y="50">5</text><text x="599" y="50">6</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@FG@" opacity="0.6" text-anchor="end">
    <text x="426" y="77">1</text><text x="426" y="107">2</text><text x="426" y="137">3</text>
    <text x="426" y="167">4</text><text x="426" y="197">5</text><text x="426" y="227">6</text>
  </g>
  <rect x="434" y="58" width="180" height="180" fill="none" stroke="@FG@" stroke-width="1.2" opacity="0.4"/>

  <g fill="@FG@" opacity="0.72">
    <rect x="439" y="63" width="20" height="20" rx="2"/>
    <rect x="499" y="63" width="20" height="20" rx="2"/>
    <rect x="529" y="63" width="20" height="20" rx="2"/>
    <rect x="559" y="63" width="20" height="20" rx="2"/>
    <rect x="589" y="63" width="20" height="20" rx="2"/>
    <rect x="439" y="123" width="20" height="20" rx="2"/>
    <rect x="499" y="123" width="20" height="20" rx="2"/>
    <rect x="439" y="153" width="20" height="20" rx="2"/><rect x="529" y="153" width="20" height="20" rx="2"/><rect x="559" y="153" width="20" height="20" rx="2"/><rect x="589" y="153" width="20" height="20" rx="2"/>
    <rect x="439" y="183" width="20" height="20" rx="2"/><rect x="529" y="183" width="20" height="20" rx="2"/><rect x="559" y="183" width="20" height="20" rx="2"/><rect x="589" y="183" width="20" height="20" rx="2"/>
    <rect x="439" y="213" width="20" height="20" rx="2"/><rect x="529" y="213" width="20" height="20" rx="2"/><rect x="559" y="213" width="20" height="20" rx="2"/><rect x="589" y="213" width="20" height="20" rx="2"/>
  </g>

  <g fill="@BLUE@">
    <rect x="469" y="63" width="20" height="20" rx="2"/>
    <rect x="439" y="93" width="20" height="20" rx="2"/>
    <rect x="469" y="93" width="20" height="20" rx="2"/>
    <rect x="499" y="93" width="20" height="20" rx="2"/>
    <rect x="469" y="123" width="20" height="20" rx="2"/>
  </g>

  <text x="628" y="107" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@BLUE@">row 2</text>
  <line x1="622" y1="103" x2="612" y2="103" stroke="@BLUE@" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="479" y="262" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="@BLUE@" text-anchor="middle">col 2</text>
  <line x1="479" y1="248" x2="479" y2="240" stroke="@BLUE@" stroke-width="1.4" marker-end="url(#ar)"/>

  <text x="434" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="@FG@" opacity="0.72">nonzero  &#8660;  i and j comparable</text>
</svg>
