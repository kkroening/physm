<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 442" width="920" height="442" role="img" aria-label="Dataflow of one solve: five linear-time sweeps feed a shared bus, which feeds an assembly step that costs quartic time for a chain, then a QR solve. A dashed sixth sweep, absent from the code, would reduce the assembly to order n times depth.">
  <defs>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2328"/>
    </marker>
    <marker id="ar2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <text x="20" y="22" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#1f2328" opacity="0.62">ONE SOLVE &#8212; INPUT q, q&#775;</text>
  <text x="900" y="22" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.6" fill="#1f2328" opacity="0.62">&#215;4 PER RK4 TICK</text>

  <g fill="none" stroke="#1f2328" stroke-width="1.3" opacity="0.55">
    <rect x="20"  y="42" width="152" height="70" rx="3"/>
    <rect x="202" y="42" width="152" height="70" rx="3"/>
    <rect x="384" y="42" width="152" height="70" rx="3"/>
    <rect x="566" y="42" width="152" height="70" rx="3"/>
    <rect x="748" y="42" width="152" height="70" rx="3"/>
  </g>

  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#953800" text-anchor="middle">
    <text x="96"  y="62">pos_mats (+ inv)</text>
    <text x="278" y="62">vel_mats + accel</text>
    <text x="460" y="62">vel_sum_mats</text>
    <text x="642" y="62">accel_sum_mats</text>
    <text x="824" y="62">weight_pos_vecs</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#0969da" text-anchor="middle">
    <text x="96"  y="85">M&#7522;</text>
    <text x="278" y="85">V&#7522; , &#119964;&#7522;</text>
    <text x="460" y="85">S&#7522;</text>
    <text x="642" y="85">A&#7522;</text>
    <text x="824" y="85">x<tspan font-size="11" dy="3">w</tspan></text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1f2328" opacity="0.6" text-anchor="middle">
    <text x="96"  y="103">&#8595; root &#8594; leaf</text>
    <text x="278" y="103">per frame</text>
    <text x="460" y="103">&#8595; prefix sum</text>
    <text x="642" y="103">&#8595; prefix sum</text>
    <text x="824" y="103">per weight</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#1f2328" opacity="0.5" text-anchor="middle">
    <text x="96" y="130">O(n)</text><text x="278" y="130">O(n)</text><text x="460" y="130">O(n)</text>
    <text x="642" y="130">O(n)</text><text x="824" y="130">O(n)</text>
  </g>

  <g stroke="#1f2328" stroke-width="1.3" opacity="0.5" marker-end="url(#ar2)">
    <line x1="172" y1="77" x2="196" y2="77"/>
    <line x1="354" y1="77" x2="378" y2="77"/>
    <line x1="536" y1="77" x2="560" y2="77"/>
    <line x1="718" y1="77" x2="742" y2="77"/>
  </g>

  <g stroke="#1f2328" stroke-width="1.3" opacity="0.5">
    <line x1="96"  y1="112" x2="96"  y2="164"/>
    <line x1="278" y1="112" x2="278" y2="164"/>
    <line x1="460" y1="112" x2="460" y2="164"/>
    <line x1="642" y1="112" x2="642" y2="164"/>
    <line x1="824" y1="112" x2="824" y2="164"/>
    <line x1="96"  y1="164" x2="824" y2="164"/>
  </g>
  <line x1="460" y1="164" x2="460" y2="196" stroke="#1f2328" stroke-width="1.6" opacity="0.7" marker-end="url(#ar2)"/>

  <rect x="290" y="202" width="340" height="68" rx="3" fill="none" stroke="#1f2328" stroke-width="1.8"/>
  <text x="460" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f2328">assemble  g<tspan font-size="11" dy="3">ij</tspan><tspan dy="-3">  and  f</tspan><tspan font-size="11" dy="3">i</tspan></text>
  <text x="460" y="248" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2328" opacity="0.6">subtree re-summed per matrix entry</text>
  <text x="460" y="264" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#953800">O(n&#8308;)  chain</text>

  <rect x="660" y="202" width="234" height="68" rx="3" fill="none" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="777" y="226" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#0969da">6.  composite  &#119973;<tspan font-size="11" dy="3">j</tspan></text>
  <text x="777" y="244" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0969da" opacity="0.85">&#8593; leaf &#8594; root &#183; absent</text>
  <text x="777" y="261" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#0969da" opacity="0.85">would give O(n&#183;depth)</text>
  <line x1="656" y1="236" x2="634" y2="236" stroke="#0969da" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ar2b)"/>

  <line x1="460" y1="270" x2="460" y2="300" stroke="#1f2328" stroke-width="1.6" opacity="0.7" marker-end="url(#ar2)"/>
  <rect x="320" y="306" width="280" height="52" rx="3" fill="none" stroke="#1f2328" stroke-width="1.3" opacity="0.55"/>
  <text x="460" y="329" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13.5" fill="#1f2328">QR factorization</text>
  <text x="460" y="347" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2328" opacity="0.6">Cholesky suffices generically</text>

  <line x1="460" y1="358" x2="460" y2="388" stroke="#1f2328" stroke-width="1.6" opacity="0.7" marker-end="url(#ar2)"/>
  <text x="460" y="412" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="16" fill="#0969da">q&#776; = g&#8315;&#185;( Q &#8722; &#915;q&#775;q&#775; )</text>
  <text x="460" y="432" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1f2328" opacity="0.6">forced geodesic flow on (Q, g)</text>
</svg>
