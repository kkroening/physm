# Builds and tests physm-js on every push and pull request.
#
# This exists because nothing built this package between 2020 and 2026, which is
# how it reached the point of being uninstallable: its toolchain had been
# deprecated, one of its dependencies had no build for the machine it was next
# opened on, and nothing anywhere said which Node version it wanted. A job that
# runs the package from a clean checkout is what turns that class of failure into
# a red build the week it happens rather than a rewrite five years later.
#
# It covers physm-rs too, incidentally but importantly: physm-js/src/Solver.test.js
# steps JsSolver and RsSolver over the same scene and asserts they agree, so this
# is the only differential check the Rust solver has against an independent
# implementation of the same equations.

name: physm-js

on:
  push:
    branches: [master]
    paths:
      - 'physm-js/**'
      - 'physm-rs/**'
      - '.github/workflows/physm-js.yml'
  pull_request:
    paths:
      - 'physm-js/**'
      - 'physm-rs/**'
      - '.github/workflows/physm-js.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: physm-js-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physm-js

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The same file `nvm use` reads locally, so CI and a developer's shell
          # cannot drift apart.
          node-version-file: physm-js/.nvmrc
          cache: npm
          cache-dependency-path: physm-js/package-lock.json

      # Cargo.lock is not committed for this crate, so the key tracks Cargo.toml.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physm-rs/target
          key: cargo-${{ runner.os }}-${{ hashFiles('physm-rs/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # physm-js depends on physm-rs as `file:../physm-rs/pkg`, a build output that
      # is not committed. Both wasm targets are built before `npm ci` so the link
      # resolves to a real directory rather than dangling until the first build.
      # The two targets are not interchangeable: `pkg` (bundler) is what the browser
      # imports, `nodepkg` (nodejs) is what Solver.test.js imports.
      - name: Build wasm (bundler target, for the app)
        run: npm run wasm

      - name: Build wasm (nodejs target, for the tests)
        run: npm run wasm:node

      - name: Install dependencies
        run: npm ci

      # Warnings do not fail the build: restoring lint after five unlinted years
      # surfaces pre-existing unused imports, while the react-hooks rules that
      # actually matter are configured as errors.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
