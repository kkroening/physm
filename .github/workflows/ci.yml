# Continuous integration: one job per package.
#
# This exists because nothing built physm-js between 2020 and 2026, which is how
# it reached the point of being uninstallable: its toolchain had been deprecated,
# one of its dependencies had no build for the machine it was next opened on, and
# nothing anywhere said which Node version it wanted. Running a package from a
# clean checkout is what turns that class of failure into a red build the week it
# happens rather than a rewrite five years later.
#
# Note that `on.*.paths` filters the whole workflow, not individual jobs, so the
# list below is the union across every job here. A package whose files did not
# change may still have its job run; for jobs this cheap that is preferable to
# per-job change detection.

name: CI

on:
  push:
    branches: [master]
    paths:
      - 'physm-js/**'
      - 'physm-rs/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'physm-js/**'
      - 'physm-rs/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physm-rs:
    name: physm-rs (fmt, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physm-rs

    steps:
      - uses: actions/checkout@v7

      # Cargo.lock is not committed for this crate, so the key tracks Cargo.toml.
      # Keyed separately from the physm-js job, which builds wasm32 artifacts into
      # the same target directory; one shared key would mean whichever job finished
      # first decided what the other restored.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physm-rs/target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('physm-rs/Cargo.toml') }}
          restore-keys: cargo-native-${{ runner.os }}-

      # Unlike the JS side's lint step, this one blocks: the tree is already
      # rustfmt-clean, so it costs nothing and catches drift the moment it appears.
      # `cargo clippy` is deliberately not run here — it reports ~58 warnings of
      # pre-existing debt, and deciding what to do about those is its own change.
      - name: Check formatting
        run: cargo fmt --check

      # `tests/web.rs` is gated to `target_arch = "wasm32"`, so it compiles to
      # nothing here and a plain `cargo test` needs no wasm toolchain.
      - name: Test
        run: cargo test

  physm-js:
    name: physm-js (lint, test, build)
    runs-on: ubuntu-latest
    # This job covers physm-rs as well, which is most of its value:
    # physm-js/src/Solver.test.js steps JsSolver and RsSolver over the same scene
    # and asserts they agree, so it is the only differential check the Rust solver
    # has against an independent implementation of the same equations. That is also
    # why `physm-rs/**` is in the trigger paths above.
    defaults:
      run:
        working-directory: physm-js

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # The same file `nvm use` reads locally, so CI and a developer's shell
          # cannot drift apart.
          node-version-file: physm-js/.nvmrc
          cache: npm
          cache-dependency-path: physm-js/package-lock.json

      # Cargo.lock is not committed for this crate, so the key tracks Cargo.toml.
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            physm-rs/target
          key: cargo-wasm-${{ runner.os }}-${{ hashFiles('physm-rs/Cargo.toml') }}
          restore-keys: cargo-wasm-${{ runner.os }}-

      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      # physm-js depends on physm-rs as `file:../physm-rs/pkg`, a build output that
      # is not committed. Both wasm targets are built before `npm ci` so the link
      # resolves to a real directory rather than dangling until the first build.
      # The two targets are not interchangeable: `pkg` (bundler) is what the browser
      # imports, `nodepkg` (nodejs) is what Solver.test.js imports.
      - name: Build wasm (bundler target, for the app)
        run: npm run wasm

      - name: Build wasm (nodejs target, for the tests)
        run: npm run wasm:node

      - name: Install dependencies
        run: npm ci

      # Warnings do not fail the build: restoring lint after five unlinted years
      # surfaces pre-existing unused imports, while the react-hooks rules that
      # actually matter are configured as errors.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
